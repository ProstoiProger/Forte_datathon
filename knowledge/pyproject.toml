[project]
name = "forte-kb"
version = "0.1.0"
description = "Local knowledge bases for the cash-discipline video service: empirical case memory (and later the regulatory corpus)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
    "qwen-vl-utils>=0.0.14",
    "pillow>=11",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "httpx>=0.28",
    "scikit-learn>=1.6",
]

[project.scripts]
kb = "forte_kb.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forte_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
