[project]
name = "cashwatch"
version = "0.1.0"
description = "Local video analysis service that flags visible cash-desk discipline violations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "python-multipart>=0.0.20",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "opencv-python-headless>=4.12",
    "numpy>=2.3",
]

[project.scripts]
cashwatch = "cashwatch.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "httpx2>=2.13.1",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
